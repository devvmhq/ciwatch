name: feature
description: >-
  Build one dex task as a feature: a design with acceptance cases and non-goals,
  your approval, failing tests for each case, implement, self-review, adversarial
  review against the spec (at most 3 rounds, stopping to ask you if the fixes go
  in circles), a polish step for minor findings, the mise gate and your review,
  each step committed on the run's branch, which then lands on local main with a
  merge commit. Never pushes. Start it with the pack's bin/factory:
  `factory feature <dex-id>`.
provider: claude
model: sonnet
worktree:
  enabled: true
inputs:
  task:
    required: true
    description: The dex task ID to build.

# The non-AI steps all run scripts/factory.ts (.shared/factory.ts), naming the
# step and the lane to record; an empty lane leaves it as it is.
nodes:
  # Lane: design. Prints the task as JSON for the prompts.
  - id: task
    script: factory
    runtime: bun
    with: { step: start, task: $INPUTS.task, lane: design }

  - id: design
    depends_on: [task]
    command: factory-design
    model: opus
    allowed_tools: [Read, Grep, Glob]

  - id: lane-design-approval
    depends_on: [design]
    script: factory
    runtime: bun
    with: { step: lane, task: $INPUTS.task, lane: design-approval }

  - id: approve-design
    depends_on: [lane-design-approval]
    wait:
      form: approval
      attention: |
        Design for dex task $INPUTS.task. Its acceptance cases and non-goals
        are the spec the change is built and reviewed against. Approve to start
        building (your comment is passed to the builder and recorded with the
        spec), or reject with a reason.

        $design.output

  - id: design-rejected
    depends_on: [approve-design]
    when: "$approve-design.output.decision == 'reject'"
    cancel: The design was rejected.

  # Lane: build.
  - id: lane-build
    depends_on: [approve-design]
    when: "$approve-design.output.decision == 'approve'"
    script: factory
    runtime: bun
    with: { step: lane, task: $INPUTS.task, lane: build }

  # The approved spec: the design and the approval comment, kept for the tests
  # commit. Archon substitutes node outputs into bash already shell-quoted.
  - id: spec
    depends_on: [lane-build]
    bash: |
      design=$design.output
      approval=$approve-design.output.text
      printf '%s\n' "$design" > "$ARTIFACTS_DIR/design.md"
      printf '%s\n' "$approval" > "$ARTIFACTS_DIR/approval.txt"

  - id: spec-check
    depends_on: [spec]
    script: factory
    runtime: bun
    with: { step: spec-check, task: $INPUTS.task, lane: "" }

  - id: tests
    depends_on: [spec-check]
    command: factory-write-tests

  - id: red
    depends_on: [tests]
    script: factory
    runtime: bun
    with: { step: red, task: $INPUTS.task, lane: "" }

  # Each stage commits what it changed on the run's branch, with the message
  # its AI step wrote, so the branch lands with every step. The tests commit
  # also records the approved spec.
  - id: commit-tests
    depends_on: [red]
    script: factory
    runtime: bun
    with: { step: checkpoint-tests, task: $INPUTS.task, lane: "" }

  - id: implement
    depends_on: [commit-tests]
    command: factory-implement
    context:
      resume: tests

  - id: commit-implement
    depends_on: [implement]
    script: factory
    runtime: bun
    with: { step: checkpoint-implement, task: $INPUTS.task, lane: "" }

  - id: self-review
    depends_on: [commit-implement]
    command: factory-self-review
    context:
      resume: implement

  - id: commit-self-review
    depends_on: [self-review]
    script: factory
    runtime: bun
    with: { step: checkpoint-self-review, task: $INPUTS.task, lane: "" }

  # Lane: review. A fresh reviewer each round, without write tools, holds the
  # change to the spec; a fixer fixes its blockers and majors, and the round is
  # committed with both. The loop ends when the reviewer ships, or early when
  # the majors come from the previous round's fix (churn). Reaching the cap
  # fails the run for a human to judge.
  - id: review-loop
    depends_on: [commit-self-review]
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: 'ship=$review.output.ship; churn=$review.output.churn; [ "$ship" = true ] || [ "$churn" = true ]'
      nodes:
        - id: diff
          script: factory
          runtime: bun
          with: { step: diff, task: $INPUTS.task, lane: review }

        # The branch's commit messages: the spec and earlier rounds' findings.
        - id: history
          script: factory
          runtime: bun
          with: { step: history, task: $INPUTS.task, lane: "" }

        - id: review
          depends_on: [diff, history]
          command: factory-adversarial-review
          model: opus
          allowed_tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              ship: { type: boolean }
              churn: { type: boolean }
              summary: { type: string }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    file: { type: string }
                    line: { type: integer }
                    severity: { type: string, enum: [blocker, major, minor] }
                    problem: { type: string }
                    fix: { type: string }
                    from_previous_fix: { type: boolean }
                  required: [file, severity, problem, fix, from_previous_fix]
              backlog:
                type: array
                items: { type: string }
            required: [ship, churn, summary, findings, backlog]

        - id: fix
          depends_on: [review]
          when: "$review.output.ship != true && $review.output.churn != true"
          command: factory-fix-findings

        - id: commit-review
          depends_on: [fix]
          script: factory
          runtime: bun
          with: { step: checkpoint-review, task: $INPUTS.task, lane: "" }

        # The group's output is its terminal nodes' output, and the fix and its
        # commit are skipped when the reviewer ships or calls churn, so this
        # node always gives the verdict. Archon substitutes $review.output into
        # bash already shell-quoted.
        - id: verdict
          depends_on: [review, commit-review]
          trigger_rule: none_failed_min_one_success
          bash: |
            verdict=$review.output
            printf '%s\n' "$verdict"

  # Churn: the fixes went in circles, so ask for a design change instead of
  # another round. Reject to stop and redesign, or approve to carry on to the
  # polish step and the gate, with the open majors left for the final review.
  - id: redesign
    depends_on: [review-loop]
    when: "$review-loop.output.churn == true"
    wait:
      form: approval
      attention: |
        The review of dex task $INPUTS.task stopped: its blocker or major
        findings came from the previous round's fix, so another round would
        likely go in circles. Reject with a reason to stop here and redesign
        (the branch is kept), or approve to carry on to the polish step and
        the gate, with these findings left open for your final review.

        Last adversarial review:
        $review-loop.output

  - id: redesign-rejected
    depends_on: [redesign]
    when: "$redesign.output.decision == 'reject'"
    cancel: Stopped for a design change after the review went in circles.

  # Lane: polish. The review's minor findings, fixed inside the run.
  # Runs after the loop, or after an approved redesign stop; a rejected one
  # cancels the run first.
  - id: lane-polish
    depends_on: [review-loop, redesign]
    trigger_rule: none_failed_min_one_success
    script: factory
    runtime: bun
    with: { step: lane, task: $INPUTS.task, lane: polish }

  - id: polish
    depends_on: [lane-polish]
    command: factory-polish

  - id: commit-polish
    depends_on: [polish]
    script: factory
    runtime: bun
    with: { step: checkpoint-polish, task: $INPUTS.task, lane: "" }

  # Lane: gate.
  - id: gate
    depends_on: [commit-polish]
    script: factory
    runtime: bun
    with: { step: gate, task: $INPUTS.task, lane: gate }

  - id: commit-gate
    depends_on: [gate]
    script: factory
    runtime: bun
    with: { step: checkpoint-gate, task: $INPUTS.task, lane: "" }

  # The whole change as it will land.
  - id: final-diff
    depends_on: [commit-gate]
    script: factory
    runtime: bun
    with: { step: diff, task: $INPUTS.task, lane: "" }

  - id: commit-message
    depends_on: [final-diff]
    command: factory-commit-message
    allowed_tools: [Read, Grep, Glob, Write]

  # Lane: human-review.
  - id: summary
    depends_on: [commit-message]
    script: factory
    runtime: bun
    with: { step: summary, task: $INPUTS.task, lane: human-review }

  - id: approve-final
    depends_on: [summary]
    wait:
      form: approval
      attention: |
        Dex task $INPUTS.task passed review, polish and the gate, and is ready
        for your review. Approve to land its branch on local main with a merge
        commit (nothing is pushed), or reject with a reason to stop here and
        keep the worktree and its branch. To have the minor findings or the
        backlog notes become a fix task, say so in your comment.

        Merge commit message:

        $commit-message.output

        $summary.output

        Last adversarial review:
        $review-loop.output

  - id: final-rejected
    depends_on: [approve-final]
    when: "$approve-final.output.decision == 'reject'"
    cancel: The change was rejected at the final review.

  # Lane: done (the land step records it once the merge is in).
  - id: land
    depends_on: [approve-final]
    when: "$approve-final.output.decision == 'approve'"
    script: factory
    runtime: bun
    with: { step: land, task: $INPUTS.task, lane: "" }
