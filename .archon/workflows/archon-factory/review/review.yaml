name: review
description: >-
  Continue a feature or fix run whose adversarial review hit its cap: adopt
  that run's branch, review it again (at most 3 more rounds, the reviewer
  seeing every earlier round's findings), pass the mise gate and your review,
  then land the branch on local main with a merge commit. Never pushes. Start
  it with the pack's bin/factory: `factory review <dex-id> <run-id>`.
provider: claude
model: sonnet
worktree:
  enabled: true
inputs:
  task:
    required: true
    description: The dex task ID of the run being continued.

# The non-AI steps all run scripts/factory.ts (.shared/factory.ts), naming the
# step and the lane to record; an empty lane leaves it as it is.
nodes:
  # Lane: review. Takes the base from where the adopted branch left main.
  - id: task
    script: factory
    runtime: bun
    with: { step: continue, task: $INPUTS.task, lane: review }

  - id: review-loop
    depends_on: [task]
    loop_group:
      max_iterations: 3
      fresh_context: true
      until_bash: 'ship=$review.output.ship; [ "$ship" = true ]'
      nodes:
        - id: diff
          script: factory
          runtime: bun
          with: { step: diff, task: $INPUTS.task, lane: review }

        # The branch's commit messages, earlier rounds' findings included.
        - id: history
          script: factory
          runtime: bun
          with: { step: history, task: $INPUTS.task, lane: "" }

        - id: review
          depends_on: [diff, history]
          command: factory-adversarial-review
          model: opus
          allowed_tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              ship: { type: boolean }
              summary: { type: string }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    file: { type: string }
                    line: { type: integer }
                    severity: { type: string, enum: [blocker, major, minor] }
                    problem: { type: string }
                    fix: { type: string }
                  required: [file, severity, problem, fix]
            required: [ship, summary, findings]

        - id: fix
          depends_on: [review]
          when: "$review.output.ship != true"
          command: factory-fix-findings

        - id: commit-review
          depends_on: [fix]
          script: factory
          runtime: bun
          with: { step: checkpoint-review, task: $INPUTS.task, lane: "" }

        # The group's output is its terminal nodes' output, and the fix and its
        # commit are skipped when the reviewer ships, so this node always gives
        # the verdict. Archon substitutes $review.output into bash already
        # shell-quoted.
        - id: verdict
          depends_on: [review, commit-review]
          trigger_rule: none_failed_min_one_success
          bash: |
            verdict=$review.output
            printf '%s\n' "$verdict"

  # Lane: gate.
  - id: gate
    depends_on: [review-loop]
    script: factory
    runtime: bun
    with: { step: gate, task: $INPUTS.task, lane: gate }

  - id: commit-gate
    depends_on: [gate]
    script: factory
    runtime: bun
    with: { step: checkpoint-gate, task: $INPUTS.task, lane: "" }

  # The whole change as it will land.
  - id: final-diff
    depends_on: [commit-gate]
    script: factory
    runtime: bun
    with: { step: diff, task: $INPUTS.task, lane: "" }

  - id: commit-message
    depends_on: [final-diff]
    command: factory-commit-message
    allowed_tools: [Read, Grep, Glob, Write]

  # Lane: human-review.
  - id: summary
    depends_on: [commit-message]
    script: factory
    runtime: bun
    with: { step: summary, task: $INPUTS.task, lane: human-review }

  - id: approve-final
    depends_on: [summary]
    wait:
      form: approval
      attention: |
        Dex task $INPUTS.task passed its continued review and the gate, and is
        ready for your review. Approve to land its branch on local main with a
        merge commit (nothing is pushed), or reject with a reason to stop here
        and keep the worktree and its branch.

        Merge commit message:

        $commit-message.output

        $summary.output

        Last adversarial review:
        $review-loop.output

  - id: final-rejected
    depends_on: [approve-final]
    when: "$approve-final.output.decision == 'reject'"
    cancel: The change was rejected at the final review.

  # Lane: done (the land step records it once the merge is in).
  - id: land
    depends_on: [approve-final]
    when: "$approve-final.output.decision == 'approve'"
    script: factory
    runtime: bun
    with: { step: land, task: $INPUTS.task, lane: "" }
