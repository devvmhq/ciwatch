name: fix
description: >-
  Fix one dex task's bug: write a test that reproduces it and fails, fix it,
  adversarial review against the bug and its test (at most 2 rounds, stopping
  to ask you if the fixes go in circles), a polish step for minor findings,
  the mise gate and your review, each step committed on the run's branch,
  which then lands on local main with a merge commit. Never pushes. Start it
  with the pack's bin/factory: `factory fix <dex-id>`.
provider: claude
model: sonnet
worktree:
  enabled: true
inputs:
  task:
    required: true
    description: The dex task ID to fix.

# The non-AI steps all run scripts/factory.ts (.shared/factory.ts), naming the
# step and the lane to record; an empty lane leaves it as it is.
nodes:
  # Lane: reproduce.
  - id: task
    script: factory
    runtime: bun
    with: { step: start, task: $INPUTS.task, lane: reproduce }

  - id: reproduce
    depends_on: [task]
    command: factory-reproduce

  - id: red
    depends_on: [reproduce]
    script: factory
    runtime: bun
    with: { step: red, task: $INPUTS.task, lane: "" }

  # Each stage commits what it changed on the run's branch, with the message
  # its AI step wrote, so the branch lands with every step.
  - id: commit-reproduce
    depends_on: [red]
    script: factory
    runtime: bun
    with: { step: checkpoint-reproduce, task: $INPUTS.task, lane: "" }

  # Lane: build.
  - id: lane-build
    depends_on: [commit-reproduce]
    script: factory
    runtime: bun
    with: { step: lane, task: $INPUTS.task, lane: build }

  - id: fix
    depends_on: [lane-build]
    command: factory-fix-bug
    context:
      resume: reproduce

  - id: commit-fix
    depends_on: [fix]
    script: factory
    runtime: bun
    with: { step: checkpoint-fix, task: $INPUTS.task, lane: "" }

  # Lane: review. The spec is the task's bug and the test that reproduces it.
  # Each round is committed with the reviewer's findings and the answers to
  # them; the loop ends when the reviewer ships, or early on churn.
  - id: review-loop
    depends_on: [commit-fix]
    loop_group:
      max_iterations: 2
      fresh_context: true
      until_bash: 'ship=$review.output.ship; churn=$review.output.churn; [ "$ship" = true ] || [ "$churn" = true ]'
      nodes:
        - id: diff
          script: factory
          runtime: bun
          with: { step: diff, task: $INPUTS.task, lane: review }

        # The branch's commit messages: the bug's test and earlier rounds'
        # findings.
        - id: history
          script: factory
          runtime: bun
          with: { step: history, task: $INPUTS.task, lane: "" }

        - id: review
          depends_on: [diff, history]
          command: factory-adversarial-review
          model: opus
          allowed_tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              ship: { type: boolean }
              churn: { type: boolean }
              summary: { type: string }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    file: { type: string }
                    line: { type: integer }
                    severity: { type: string, enum: [blocker, major, minor] }
                    problem: { type: string }
                    fix: { type: string }
                    from_previous_fix: { type: boolean }
                  required: [file, severity, problem, fix, from_previous_fix]
              backlog:
                type: array
                items: { type: string }
            required: [ship, churn, summary, findings, backlog]

        - id: fix-findings
          depends_on: [review]
          when: "$review.output.ship != true && $review.output.churn != true"
          command: factory-fix-findings

        - id: commit-review
          depends_on: [fix-findings]
          script: factory
          runtime: bun
          with: { step: checkpoint-review, task: $INPUTS.task, lane: "" }

        # The group's output is its terminal nodes' output, and fix-findings and
        # its commit are skipped when the reviewer ships or calls churn, so this
        # node always gives the verdict. Archon substitutes $review.output into
        # bash already shell-quoted.
        - id: verdict
          depends_on: [review, commit-review]
          trigger_rule: none_failed_min_one_success
          bash: |
            verdict=$review.output
            printf '%s\n' "$verdict"

  # Churn: ask for a design change instead of another round.
  - id: redesign
    depends_on: [review-loop]
    when: "$review-loop.output.churn == true"
    wait:
      form: approval
      attention: |
        The review of dex task $INPUTS.task stopped: its blocker or major
        findings came from the previous round's fix, so another round would
        likely go in circles. Reject with a reason to stop here and rethink the
        fix (the branch is kept), or approve to carry on to the polish step and
        the gate, with these findings left open for your final review.

        Last adversarial review:
        $review-loop.output

  - id: redesign-rejected
    depends_on: [redesign]
    when: "$redesign.output.decision == 'reject'"
    cancel: Stopped for a rethink after the review went in circles.

  # Lane: polish. Runs after the loop, or after an approved stop; a rejected
  # one cancels the run first.
  - id: lane-polish
    depends_on: [review-loop, redesign]
    trigger_rule: none_failed_min_one_success
    script: factory
    runtime: bun
    with: { step: lane, task: $INPUTS.task, lane: polish }

  - id: polish
    depends_on: [lane-polish]
    command: factory-polish

  - id: commit-polish
    depends_on: [polish]
    script: factory
    runtime: bun
    with: { step: checkpoint-polish, task: $INPUTS.task, lane: "" }

  # Lane: gate.
  - id: gate
    depends_on: [commit-polish]
    script: factory
    runtime: bun
    with: { step: gate, task: $INPUTS.task, lane: gate }

  - id: commit-gate
    depends_on: [gate]
    script: factory
    runtime: bun
    with: { step: checkpoint-gate, task: $INPUTS.task, lane: "" }

  - id: final-diff
    depends_on: [commit-gate]
    script: factory
    runtime: bun
    with: { step: diff, task: $INPUTS.task, lane: "" }

  - id: commit-message
    depends_on: [final-diff]
    command: factory-commit-message
    allowed_tools: [Read, Grep, Glob, Write]

  # Lane: human-review. A fix lands only after you've seen it, like a feature.
  - id: summary
    depends_on: [commit-message]
    script: factory
    runtime: bun
    with: { step: summary, task: $INPUTS.task, lane: human-review }

  - id: approve-final
    depends_on: [summary]
    wait:
      form: approval
      attention: |
        The fix for dex task $INPUTS.task passed review, polish and the gate,
        and is ready for your review. Approve to land its branch on local main
        with a merge commit (nothing is pushed), or reject with a reason to
        stop here and keep the worktree and its branch.

        Merge commit message:

        $commit-message.output

        $summary.output

        Last adversarial review:
        $review-loop.output

  - id: final-rejected
    depends_on: [approve-final]
    when: "$approve-final.output.decision == 'reject'"
    cancel: The fix was rejected at the final review.

  # Lane: done (the land step records it once the merge is in).
  - id: land
    depends_on: [approve-final]
    when: "$approve-final.output.decision == 'approve'"
    script: factory
    runtime: bun
    with: { step: land, task: $INPUTS.task, lane: "" }
