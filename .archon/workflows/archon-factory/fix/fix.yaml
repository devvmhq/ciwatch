name: fix
description: >-
  Fix one dex task's bug: write a test that reproduces it and fails, fix it,
  adversarial review until SHIP (at most 2 rounds) and the mise gate, each step
  committed on the run's branch, which then lands on local main with a merge
  commit. Never pushes. Start it with the pack's
  bin/factory: `factory fix <dex-id>`.
provider: claude
model: sonnet
worktree:
  enabled: true
inputs:
  task:
    required: true
    description: The dex task ID to fix.

# The non-AI steps all run scripts/factory.ts (.shared/factory.ts), naming the
# step and the lane to record; an empty lane leaves it as it is.
nodes:
  # Lane: reproduce.
  - id: task
    script: factory
    runtime: bun
    with: { step: start, task: $INPUTS.task, lane: reproduce }

  - id: reproduce
    depends_on: [task]
    command: factory-reproduce

  - id: red
    depends_on: [reproduce]
    script: factory
    runtime: bun
    with: { step: red, task: $INPUTS.task, lane: "" }

  # Each stage commits what it changed on the run's branch, with the message
  # its AI step wrote, so the branch lands with every step.
  - id: commit-reproduce
    depends_on: [red]
    script: factory
    runtime: bun
    with: { step: checkpoint-reproduce, task: $INPUTS.task, lane: "" }

  # Lane: build.
  - id: lane-build
    depends_on: [commit-reproduce]
    script: factory
    runtime: bun
    with: { step: lane, task: $INPUTS.task, lane: build }

  - id: fix
    depends_on: [lane-build]
    command: factory-fix-bug
    context:
      resume: reproduce

  - id: commit-fix
    depends_on: [fix]
    script: factory
    runtime: bun
    with: { step: checkpoint-fix, task: $INPUTS.task, lane: "" }

  # Lane: review. Each round is committed with the reviewer's findings and the
  # answers to them.
  - id: review-loop
    depends_on: [commit-fix]
    loop_group:
      max_iterations: 2
      fresh_context: true
      until_bash: 'ship=$review.output.ship; [ "$ship" = true ]'
      nodes:
        - id: diff
          script: factory
          runtime: bun
          with: { step: diff, task: $INPUTS.task, lane: review }

        # The branch's commit messages, earlier rounds' findings included.
        - id: history
          script: factory
          runtime: bun
          with: { step: history, task: $INPUTS.task, lane: "" }

        - id: review
          depends_on: [diff, history]
          command: factory-adversarial-review
          model: opus
          allowed_tools: [Read, Grep, Glob]
          output_format:
            type: object
            properties:
              ship: { type: boolean }
              summary: { type: string }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    file: { type: string }
                    line: { type: integer }
                    severity: { type: string, enum: [blocker, major, minor] }
                    problem: { type: string }
                    fix: { type: string }
                  required: [file, severity, problem, fix]
            required: [ship, summary, findings]

        - id: fix-findings
          depends_on: [review]
          when: "$review.output.ship != true"
          command: factory-fix-findings

        - id: commit-review
          depends_on: [fix-findings]
          script: factory
          runtime: bun
          with: { step: checkpoint-review, task: $INPUTS.task, lane: "" }

        # The group's output is its terminal nodes' output, and fix-findings and
        # its commit are skipped when the reviewer ships, so this node always
        # gives the verdict. Archon substitutes $review.output into bash already
        # shell-quoted.
        - id: verdict
          depends_on: [review, commit-review]
          trigger_rule: none_failed_min_one_success
          bash: |
            verdict=$review.output
            printf '%s\n' "$verdict"

  # Lane: gate, then done (the land step records it once the merge is in).
  - id: gate
    depends_on: [review-loop]
    script: factory
    runtime: bun
    with: { step: gate, task: $INPUTS.task, lane: gate }

  - id: commit-gate
    depends_on: [gate]
    script: factory
    runtime: bun
    with: { step: checkpoint-gate, task: $INPUTS.task, lane: "" }

  - id: final-diff
    depends_on: [commit-gate]
    script: factory
    runtime: bun
    with: { step: diff, task: $INPUTS.task, lane: "" }

  - id: commit-message
    depends_on: [final-diff]
    command: factory-commit-message
    allowed_tools: [Read, Grep, Glob, Write]

  - id: land
    depends_on: [commit-message]
    script: factory
    runtime: bun
    with: { step: land, task: $INPUTS.task, lane: "" }
