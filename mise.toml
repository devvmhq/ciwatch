[settings]
lockfile = true

[env]
CGO_ENABLED = "0"

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
gotestsum = "1.13.0"
# The factory workflows' script steps, and the task list they build from.
bun = "1.4.5"
"npm:@zeeg/dex" = "0.16.0"

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks.lint]
description = "Lint the Go code"
run = "golangci-lint run"

[tasks.test]
description = "Run the tests with the race detector"
# The race detector needs cgo.
env = { CGO_ENABLED = "1" }
run = "gotestsum -- -race ./..."

[tasks.build]
description = "Build ./ciwatch"
run = "go build -o ciwatch ./cmd/ciwatch"

[tasks.factory]
description = "Start a factory run for a dex task: mise run factory -- feature|fix <dex-id>"
run = ".archon/workflows/archon-factory/bin/factory"

[tasks.squash]
description = "Squash each task's stacked commits past the upstream into one commit, before a push"
run = ".archon/workflows/archon-factory/bin/squash"
